title: tropelon
description: "ডকুমেন্ট ও PDF, বাংলা টাইপিং, স্প্রেডশিট, প্রশ্নপত্র, ভিডিও স্ক্রিপ্ট, ডিজাইন ও ভিডিও এডিটিংয়ের কাজ অনলাইনে করিয়ে নিন। অনুরোধ পাঠিয়ে দাম ও অগ্রগতি জানুন।"
tagline: "ডকুমেন্ট ও ডিজিটাল সার্ভিস"
lang: bn
twitter:
  username: tropelonBD
url: "https://tropelon.2bd.net"
baseurl: ""
timezone: Asia/Dhaka
future: true
markdown: kramdown
permalink: /posts/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      image: /assets/og.png
exclude:
  - README.md
  - LICENSE
