# tropelon — Pages CMS (লেখা এডিটর) কনফিগ
# এই ফাইল শুধু রিপোর মালিক (GitHub অ্যাকাউন্ট) বদলাতে পারবেন, ইমেইলে আমন্ত্রিত এডিটররা পারবেন না।
#
# ট্যাগ বাঁধা তালিকা থেকে বাছতে হয় (বানান ভুল হয়ে চিপ ভাঙা ঠেকাতে)। তালিকা বদলাতে চাইলে tags ঘরের values বদলান।
# প্রতিটা লেখায় বাংলা অংশ আবশ্যক। ইংরেজি অংশ (ইংরেজি ক্যাপশন, ইংরেজি সংক্ষেপ, ইংরেজি লেখা) ঐচ্ছিক।
# ইংরেজি অংশ ফাঁকা থাকলে সাইটে ইংরেজি মোডেও বাংলা লেখাটাই দেখায়।

media:
  - name: images
    label: ছবি
    input: assets/uploads/images        # ছবি রিপোর এই ফোল্ডারে জমা হবে
    output: /assets/uploads/images      # লেখার ভেতরে এই ঠিকানা বসবে
    rename: safe                        # ফাইলের নাম নিরাপদ করে নেয় (ফাঁকা জায়গা, বিশেষ চিহ্ন বাদ)
    extensions: [png, jpg, jpeg, webp, gif]

content:
  - name: posts
    label: লেখা
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{year}{month}{day}-{hour}{minute}{second}.md"
      field: false                      # ফাইলের নাম নিজে তৈরি হয়, ভাবতে হয় না
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: ক্যাপশন (বাংলা)
        type: string
        required: true
        description: লেখার বড় ও বোল্ড শিরোনাম।
        options:
          maxlength: 150

      - name: title_en
        label: ক্যাপশন (ইংরেজি, ঐচ্ছিক)
        type: string
        description: ইংরেজি মোডে এটা দেখাবে। ফাঁকা রাখলে বাংলাটাই দেখাবে।
        options:
          maxlength: 150

      - name: date
        label: তারিখ ও সময়
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm"

      - name: image
        label: কভার ছবি
        type: image
        description: লেখার উপরে আর কার্ডে দেখাবে। ফাঁকা রাখলেও চলবে।
        options:
          media: images

      - name: video
        label: ভিডিও লিংক
        type: string
        description: YouTube লিংক বসান (youtu.be/... বা youtube.com/watch?v=... বা shorts)। ফাঁকা রাখলেও চলবে।

      - name: tags
        label: ট্যাগ
        type: select
        description: "তালিকা থেকে বাছুন, সর্বোচ্চ ৩টা। নিয়ম: একটা ধরন (গাইড, টিপস, টেমপ্লেট, নমুনা, ঘোষণা, টুলস) আর দরকার হলে একটা সেবা (ডকুমেন্ট থেকে ওয়েবসাইট)। এই ট্যাগ দিয়েই লেখা পেজের খোঁজার চিপ তৈরি হয়। নতুন ট্যাগ লাগলে আগে এই কনফিগে যোগ করতে হবে।"
        options:
          multiple: true
          max: 3
          values:
            - গাইড
            - টিপস
            - টেমপ্লেট
            - নমুনা
            - ঘোষণা
            - টুলস
            - ডকুমেন্ট
            - স্প্রেডশিট
            - স্ক্রিপ্ট
            - ডিজাইন
            - ভিডিও এডিটিং
            - ওয়েবসাইট

      - name: description
        label: সংক্ষেপ (বাংলা)
        type: text
        description: এক-দুই লাইনের সারকথা। কার্ডে ও সার্চ ইঞ্জিনে দেখাবে।
        options:
          maxlength: 200

      - name: description_en
        label: সংক্ষেপ (ইংরেজি, ঐচ্ছিক)
        type: text
        description: ইংরেজি মোডে কার্ডে এটা দেখাবে। ফাঁকা রাখলে বাংলাটাই দেখাবে।
        options:
          maxlength: 200

      - name: author
        label: লেখকের নাম
        type: string

      - name: body
        label: লেখা (বাংলা)
        type: rich-text
        description: মূল লেখা এখানে। টুলবার থেকে বোল্ড, লিংক, তালিকা ও ছবি যোগ করা যাবে।
        options:
          format: markdown
          media: images
          rename: safe

      - name: body_en
        label: লেখা (ইংরেজি, ঐচ্ছিক)
        type: text
        description: ইংরেজি সংস্করণ। সাধারণ লেখা চলবে। বোল্ড করতে **এভাবে**, লিংকের জন্য [নাম](https://...), তালিকার জন্য লাইনের শুরুতে "- " দিন। প্রতিটা অনুচ্ছেদের মাঝে একটা ফাঁকা লাইন রাখুন। ফাঁকা রাখলে ইংরেজি মোডেও বাংলা লেখাটাই দেখাবে।

  # ------------------------------------------------------------------
  # দামের তালিকা (_data/pricing.yml)। এখানে বদলালে /pricing/ পেজে দাম বদলে যায়।
  # দাম ফাঁকা থাকলে পেজে "আলোচনা সাপেক্ষে" দেখায়। সব দাম ফাঁকা থাকলে হিসাবের বক্সও থাকে না।
  # ------------------------------------------------------------------
  - name: pricing
    label: দামের তালিকা
    type: file
    path: _data/pricing.yml
    format: yaml
    fields:
      - name: currency
        label: টাকার চিহ্ন
        type: string
        description: দামের আগে যে চিহ্ন বসবে। সাধারণত ৳ থাকবে।
        options:
          maxlength: 5

      - name: min_order
        label: ন্যূনতম অর্ডার (টাকা)
        type: string
        description: শুধু সংখ্যা লিখুন, যেমন 300 বা ৩০০। ফাঁকা রাখলে ন্যূনতম অর্ডারের লাইন পেজে আসবে না।
        options:
          maxlength: 10

      - name: rush_percent
        label: জরুরি কাজে বাড়তি (শতাংশ)
        type: string
        description: শুধু সংখ্যা লিখুন, যেমন 25। ফাঁকা রাখলে জরুরি কাজের লাইন আসবে না।
        options:
          maxlength: 3

      - name: free_revisions
        label: বিনামূল্যে সংশোধন (বার)
        type: string
        description: কয়বার সংশোধন বিনামূল্যে, যেমন 2। ফাঁকা রাখলে এই লাইন আসবে না।
        options:
          maxlength: 2

      - name: rates
        label: কাজের ধরন ও দাম
        type: object
        description: প্রতিটা কাজের ধরনের ভেতরে একাধিক দামের লাইন থাকে।
        list:
          collapsible:
            collapsed: true
            summary: "{fields.bn}"
        fields:
          - name: key
            label: কাজের ধরন (কোড)
            type: select
            required: true
            description: এটা বদলাবেন না। অনুরোধ ফর্মে এই ধরনটাই আগে থেকে বাছাই হয়ে যায়।
            options:
              values:
                - value: documents
                  label: ডকুমেন্ট ও PDF
                - value: spreadsheet
                  label: স্প্রেডশিট
                - value: script
                  label: ভিডিও স্ক্রিপ্ট
                - value: design
                  label: গ্রাফিক ডিজাইন
                - value: video
                  label: ভিডিও এডিটিং
                - value: website
                  label: ছোট ওয়েবসাইট

          - name: bn
            label: নাম (বাংলা)
            type: string
            required: true
            options:
              maxlength: 80

          - name: en
            label: নাম (ইংরেজি, ঐচ্ছিক)
            type: string
            description: ফাঁকা রাখলে ইংরেজি মোডেও বাংলা নামই দেখাবে।
            options:
              maxlength: 80

          - name: items
            label: দামের লাইন
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.bn} — {fields.price}"
            fields:
              - name: price
                label: দাম (টাকা)
                type: string
                description: শুধু সংখ্যা লিখুন, যেমন 50 বা ৫০ (বাংলা অঙ্কও চলবে)। ফাঁকা রাখলে "আলোচনা সাপেক্ষে" দেখাবে।
                options:
                  maxlength: 10

              - name: bn
                label: কাজের নাম (বাংলা)
                type: string
                required: true
                options:
                  maxlength: 120

              - name: en
                label: কাজের নাম (ইংরেজি, ঐচ্ছিক)
                type: string
                options:
                  maxlength: 120

              - name: unit_bn
                label: হিসাবের একক (বাংলা)
                type: string
                description: যেমন "প্রতি পেজ", "প্রতি ঘণ্টা", "প্রতি ছবি", "পুরো কাজ"।
                options:
                  maxlength: 40

              - name: unit_en
                label: হিসাবের একক (ইংরেজি, ঐচ্ছিক)
                type: string
                description: যেমন "per page", "per hour", "per image", "whole job"।
                options:
                  maxlength: 40

  # ------------------------------------------------------------------
  # পোর্টফোলিওর কাজ (_data/portfolio.yml)। এখানে বদলালে /portfolio/ পেজ বদলে যায়।
  # ক্লায়েন্টের নাম, নম্বর বা গোপন তথ্য এখানে লিখবেন না।
  # ------------------------------------------------------------------
  - name: portfolio
    label: পোর্টফোলিওর কাজ
    type: file
    path: _data/portfolio.yml
    format: yaml
    fields:
      - name: works
        label: কাজের তালিকা
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title_bn}"
        fields:
          - name: kind
            label: কাজের ধরন
            type: select
            required: true
            description: ক্লায়েন্টের কাজ, নমুনা/টেমপ্লেট, নাকি নিজের প্রকল্প।
            options:
              values:
                - value: client
                  label: ক্লায়েন্টের কাজ
                - value: sample
                  label: নমুনা ও টেমপ্লেট
                - value: own
                  label: নিজের প্রকল্প

          - name: service
            label: সেবার বিভাগ
            type: select
            required: true
            options:
              values:
                - value: documents
                  label: ডকুমেন্ট ও PDF
                - value: spreadsheet
                  label: স্প্রেডশিট
                - value: script
                  label: ভিডিও স্ক্রিপ্ট
                - value: design
                  label: গ্রাফিক ডিজাইন
                - value: video
                  label: ভিডিও এডিটিং
                - value: website
                  label: ছোট ওয়েবসাইট
                - value: other
                  label: অন্যান্য

          - name: year
            label: সাল
            type: number
            description: যেমন 2026

          - name: public
            label: ডেমো প্রকাশ করা যাবে?
            type: boolean
            description: টিক থাকলে ডেমো দেখানো হবে (ক্লায়েন্ট অনুমতি দিয়েছেন)। টিক না থাকলে "গ্রাহক প্রকাশ করার অনুমতি দেয়নি" লেখা আসবে, ডেমো আসবে না।

          - name: title_bn
            label: শিরোনাম (বাংলা)
            type: string
            required: true
            options:
              maxlength: 100

          - name: title_en
            label: শিরোনাম (ইংরেজি, ঐচ্ছিক)
            type: string
            options:
              maxlength: 100

          - name: summary_bn
            label: সংক্ষেপ (বাংলা)
            type: text
            description: কাজের ধরনের এক-দুই লাইন। ক্লায়েন্টের নাম বা গোপন তথ্য লিখবেন না।
            options:
              maxlength: 300

          - name: summary_en
            label: সংক্ষেপ (ইংরেজি, ঐচ্ছিক)
            type: text
            options:
              maxlength: 300

          - name: image
            label: ডেমোর ছবি
            type: image
            description: ঐচ্ছিক। শুধু তখনই দিন যখন ক্লায়েন্ট দেখানোর অনুমতি দিয়েছেন।
            options:
              media: images

          - name: link
            label: লিংক
            type: string
            description: ঐচ্ছিক। বাইরের লিংক (https://...) বা ভেতরের লিংক (/tools/)।

          - name: link_bn
            label: লিংকের বোতামের লেখা (বাংলা)
            type: string
            description: যেমন "দেখুন"। লিংক থাকলে এটা দিন।

          - name: link_en
            label: লিংকের বোতামের লেখা (ইংরেজি, ঐচ্ছিক)
            type: string

  # ------------------------------------------------------------------
  # লিংক ও যোগাযোগ (_data/links.yml)। এখানে বদলালে ফুটার, যোগাযোগ ও পরিচিতি পেজে বদলে যায়।
  # ------------------------------------------------------------------
  - name: links
    label: লিংক ও যোগাযোগ
    type: file
    path: _data/links.yml
    format: yaml
    fields:
      - name: whatsapp
        label: WhatsApp ইউজারনেম
        type: string
        description: "@ ছাড়া লিখুন, যেমন tropelon। অ্যাপে ইউজারনেমটা নিজের নামে রিজার্ভ করার পরেই এখানে বসান। রিজার্ভ না হওয়া পর্যন্ত ফাঁকা রাখুন, নইলে ক্লায়েন্ট অন্য কারও কাছে পৌঁছাতে পারে।"
        options:
          maxlength: 40

      - name: social
        label: সোশ্যাল লিংক
        type: object
        description: ফুটারে এই ক্রমেই দেখায়। YouTube ও Telegram-এর লিংক পরিচিতি ও যোগাযোগ পেজেও ব্যবহার হয়, তাই ওই দুটোর ধরন ঠিক রাখুন।
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: key
            label: ধরন
            type: select
            required: true
            options:
              values:
                - value: youtube
                  label: YouTube
                - value: telegram
                  label: Telegram
                - value: instagram
                  label: Instagram
                - value: x
                  label: X
                - value: reddit
                  label: Reddit
                - value: blog
                  label: ব্লগ
                - value: facebook
                  label: Facebook
                - value: tiktok
                  label: TikTok
                - value: other
                  label: অন্যান্য

          - name: name
            label: ফুটারে যে নাম দেখাবে
            type: string
            required: true
            options:
              maxlength: 30

          - name: url
            label: লিংক (https://...)
            type: string
            required: true
            description: পুরো ঠিকানা লিখুন, শুরুতে https:// সহ।
